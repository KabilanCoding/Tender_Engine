<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZYNEX – Neural Estimation Platform</title>
    <link rel="icon" type="image/png" href="/zynex-logo.png" />
    <script>
      // apply the saved theme before the first paint so there is no flash
      (function () {
        try {
          var t = localStorage.getItem('zynex-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.classList.add(t === 'dark' ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
