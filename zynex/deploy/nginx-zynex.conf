# nginx site for ZYNEX: serves the built web app and forwards /api to the backend on 127.0.0.1:8000.
# Install:  sudo cp nginx-zynex.conf /etc/nginx/sites-available/zynex
#           sudo ln -s /etc/nginx/sites-available/zynex /etc/nginx/sites-enabled/zynex && sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS, replace the `listen 80` server below with the commented TLS block and put your certificate paths in it.

server {
    listen 80;
    server_name zynex.example.internal;          # the address users type

    root /var/www/zynex;                          # contents of frontend/dist
    index index.html;

    # uploads: must be at least as large as "Max upload size" on the Settings page
    client_max_body_size 200m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;                  # AI answers can be slow on local models
    }

    # streaming AI chat answers must not be buffered
    location /api/v1/ai/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    # web app: static files, with client-side routes falling back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

